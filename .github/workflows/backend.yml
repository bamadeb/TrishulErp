name: Backend

on:
  push:
    branches: [Development, main]
    paths: ["backend/**", "database/**", "frontend/libs/core/api/openapi.json", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "database/**", "frontend/libs/core/api/openapi.json", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Vulnerable dependencies
        run: uv run --with pip-audit pip-audit --skip-editable
      - name: Migrations render as SQL
        run: uv run alembic upgrade head --sql > /dev/null
      - name: Angular client matches the API
        run: uv run python scripts/export_openapi.py --check

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build --tag trishul-api:${{ github.sha }} backend
