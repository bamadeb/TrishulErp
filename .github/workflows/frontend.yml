name: Frontend

on:
  push:
    branches: [Development, main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Vulnerable dependencies (high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: Lint, test, build
        run: npx nx run-many -t lint test build
      - name: End-to-end tests (mock API)
        run: |
          npx playwright install --with-deps chromium
          npx nx e2e erp-web-e2e -- --project=chromium
      - name: Keep Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/dist/.playwright
          retention-days: 7
